name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://app_user:app_user_dev_password@localhost:5432/marketpilot
      DATABASE_URL_DIRECT: postgresql+psycopg://marketpilot:marketpilot@localhost:5432/marketpilot
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-for-production
      FERNET_KEYS: x9aTqq6rBp68ynJ6fKa_8kUt1U89vVZFzwZSXgj34xo=
      ALLOWED_ORIGINS: http://localhost:3000
      APP_USER_DB_PASSWORD: app_user_dev_password
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marketpilot
          POSTGRES_PASSWORD: marketpilot
          POSTGRES_DB: marketpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy app

      # Creates the app_user role + RLS policies as a side effect, which the
      # app_user-backed DATABASE_URL above depends on for every later step.
      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check for model/migration drift
        run: uv run alembic check

      - name: Test
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # LayoutProps/PageProps are ambient types Next.js writes into .next/types —
      # they don't exist on a fresh checkout until this generates them, so plain
      # `tsc --noEmit` fails here with "Cannot find name 'LayoutProps'".
      - name: Generate route types
        run: pnpm exec next typegen

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Real-browser tests against the full stack: API + Celery worker + built Next app.
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://app_user:app_user_dev_password@localhost:5432/marketpilot
      DATABASE_URL_DIRECT: postgresql+psycopg://marketpilot:marketpilot@localhost:5432/marketpilot
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-for-production
      FERNET_KEYS: x9aTqq6rBp68ynJ6fKa_8kUt1U89vVZFzwZSXgj34xo=
      ALLOWED_ORIGINS: http://localhost:3000
      APP_USER_DB_PASSWORD: app_user_dev_password
      E2E_DATABASE_URL: postgresql://marketpilot:marketpilot@localhost:5432/marketpilot
      ALLOW_PRIVATE_BASE_URLS: "true"  # the e2e stub LLM listens on 127.0.0.1
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marketpilot
          POSTGRES_PASSWORD: marketpilot
          POSTGRES_DB: marketpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --frozen --all-groups

      - name: Apply migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and psql
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y postgresql-client

      - name: Build web
        working-directory: apps/web
        run: pnpm build

      # The embedding model downloads on first use (~30s on a fresh runner). Fetch it once
      # up front so no test, and neither the API nor the worker, pays for it mid-run.
      - name: Warm the embedding model
        working-directory: apps/api
        run: uv run python -c "from app.rag.embeddings import embed_query; import asyncio; asyncio.run(embed_query('warm up'))"

      - name: Start API, worker and web
        run: |
          (cd apps/api && nohup uv run uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &)
          (cd apps/api && nohup uv run celery -A app.jobs.celery_app worker --pool=solo -l info > "$RUNNER_TEMP/worker.log" 2>&1 &)
          (cd apps/web && nohup pnpm start > "$RUNNER_TEMP/web.log" 2>&1 &)
          for url in http://localhost:8000/api/v1/ready http://localhost:3000/login; do
            for i in $(seq 1 60); do curl -sf "$url" > /dev/null && break; sleep 2; done
            curl -sf "$url" > /dev/null
          done

      - name: Run Playwright tests
        working-directory: apps/web
        run: pnpm e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/test-results
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/worker.log
            ${{ runner.temp }}/web.log
