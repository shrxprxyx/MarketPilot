name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://app_user:app_user_dev_password@localhost:5432/marketpilot
      DATABASE_URL_DIRECT: postgresql+psycopg://marketpilot:marketpilot@localhost:5432/marketpilot
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-for-production
      ALLOWED_ORIGINS: http://localhost:3000
      APP_USER_DB_PASSWORD: app_user_dev_password
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: marketpilot
          POSTGRES_PASSWORD: marketpilot
          POSTGRES_DB: marketpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy app

      # Creates the app_user role + RLS policies as a side effect, which the
      # app_user-backed DATABASE_URL above depends on for every later step.
      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check for model/migration drift
        run: uv run alembic check

      - name: Test
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
