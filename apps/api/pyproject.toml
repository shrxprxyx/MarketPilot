
[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "shrxprxyx", email = "shripriya.sriram1@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23",
    "asyncpg>=0.29",
    "celery>=5.5,<5.6",
    "cryptography>=42",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic[email]>=2",
    "pydantic-settings>=2",
    "pyjwt>=2.8",
    "redis>=5,<6",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]  # autogenerated, not hand-wrapped

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.jobs.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# SRS NFR-08: at least 80 percent on the core modules (auth, tenancy, ai gateway, rag).
# CI enforces it on the whole package, which is the stricter reading.
fail_under = 80
skip_covered = true
