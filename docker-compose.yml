services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: marketpilot
      POSTGRES_PASSWORD: marketpilot
      POSTGRES_DB: marketpilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpilot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://marketpilot:marketpilot@postgres:5432/marketpilot
      DATABASE_URL_DIRECT: postgresql+psycopg://marketpilot:marketpilot@postgres:5432/marketpilot
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps/api/app:/app/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata: